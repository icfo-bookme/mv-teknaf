<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MV Teknaf — Loading preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#10234e;font-family:Inter,Arial,sans-serif}.scene{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#eaf3fa 0, #f8fafc 44%,#fff 85%)}.loader{position:relative;z-index:1;text-align:center;padding:32px 24px}.mark{width:148px;height:148px;margin:0 auto 28px;position:relative;display:grid;place-items:center}.ring{position:absolute;inset:0;border:1px solid #d9e7ef;border-radius:50%}.ring::after{content:"";position:absolute;inset:9px;border:1px dashed #d3e3ec;border-radius:50%}.ship{width:100px;height:auto;filter:brightness(0);animation:float 3.2s ease-in-out infinite}.water{position:absolute;bottom:27px;left:38px;width:73px;height:10px;overflow:hidden}.water svg{width:146px;height:10px;animation:wave 2s linear infinite}.orbit{position:absolute;inset:0;animation:orbit 6s linear infinite}.orbit::before{content:"";position:absolute;left:70px;top:-3px;width:7px;height:7px;border-radius:50%;background:#bf2333;box-shadow:0 0 0 5px #bf23330b}.brand{font-size:12px;font-weight:700;letter-spacing:.25em;margin:0 0 14px}.heading{font-size:26px;font-weight:600;letter-spacing:-.7px;margin:0 0 12px}.copy{font-size:14px;color:#768294;margin:0}.track{width:184px;height:3px;margin:28px auto 0;background:#e1e9f0;border-radius:8px;overflow:hidden}.track span{display:block;width:45%;height:100%;background:linear-gradient(90deg,#183e79,#4f9dac);border-radius:8px;animation:progress 1.8s ease-in-out infinite}.foot{position:absolute;bottom:35px;text-align:center;width:100%;font-size:10px;letter-spacing:.2em;color:#8d9dad}.sea{position:absolute;bottom:0;width:100%;height:150px;pointer-events:none}.sea path{fill:none;stroke:#deeaf1;stroke-width:1}.sea path+path{stroke:#edf3f7}@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}@keyframes wave{to{transform:translateX(-73px)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes progress{0%{transform:translateX(-105%)}100%{transform:translateX(325%)}}@media(max-width:480px){.heading{font-size:23px}.mark{margin-bottom:24px}.foot{bottom:26px;font-size:9px}.sea{height:100px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.track span{margin:auto}}
</style>
</head>
<body>
<main class="scene">
  <div class="loader" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <span class="ring"></span><span class="orbit"></span>
      <img class="ship" src="../../public/mv-logo.png" alt="" width="818" height="442">
      <div class="water"><svg viewBox="0 0 146 10"><path d="M0 5 Q9 -1 18 5 T36 5 T54 5 T73 5 T91 5 T109 5 T127 5 T146 5" fill="none" stroke="#78aaba" stroke-width="1.5"/></svg></div>
    </div>
    <p class="brand">MV TEKNAF</p>
    <h1 class="heading">Preparing your journey</h1>
    <p class="copy">Loading cruise details. Please wait a moment.</p>
    <div class="track" aria-hidden="true"><span></span></div>
  </div>
  <svg class="sea" viewBox="0 0 1440 150" preserveAspectRatio="none" aria-hidden="true"><path d="M-20 80 Q240 5 500 80 T1020 80 T1540 80"/><path d="M-20 100 Q240 25 500 100 T1020 100 T1540 100"/><path d="M-20 120 Q240 45 500 120 T1020 120 T1540 120"/></svg>
  <div class="foot">TEKNAF &nbsp; / &nbsp; SAINT MARTIN'S ISLAND</div>
</main>
</body>
</html>
